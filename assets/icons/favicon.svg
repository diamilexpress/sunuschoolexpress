<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="goldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <linearGradient id="turqGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <filter id="glowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield background -->
  <rect x="0" y="0" width="80" height="80" rx="20" fill="#0E243F" stroke="url(#turqGradIcon)" stroke-width="2" />
  
  <!-- Open Book Base -->
  <path d="M16 54 C26 48 38 48 40 54 C42 48 54 48 64 54 L64 63 C54 57 42 57 40 63 C38 57 26 57 16 63 Z" fill="url(#goldGradIcon)" opacity="0.9" />
  <path d="M18 51 C27 46 38 46 40 51 C42 46 53 46 62 51 L62 53 C53 48 42 48 40 53 C38 48 27 48 18 53 Z" fill="#FFFFFF" opacity="0.8" />
  
  <!-- Spine -->
  <line x1="40" y1="52" x2="40" y2="63" stroke="#0E243F" stroke-width="1.5" />

  <!-- Lamp of Knowledge -->
  <path d="M30 46 C30 43 33 42 40 42 C47 42 50 43 50 46 C48 48 32 48 30 46 Z" fill="url(#goldGradIcon)" />
  <path d="M28 44 C24 43 23 39 27 38 C31 37 36 41 36 43" stroke="url(#goldGradIcon)" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M46 43 C52 42 56 39 58 36 C55 36 49 40 46 42 Z" fill="url(#goldGradIcon)" />
  
  <!-- Flame -->
  <path d="M58 35 C59 31 58 27 55 23 C53 27 50 28 51 32 C52 35 56 36 58 35 Z" fill="url(#turqGradIcon)" filter="url(#glowIcon)" />
  <circle cx="55" cy="27" r="2.5" fill="#FFE082" />
  <circle cx="40" cy="22" r="1.5" fill="url(#turqGradIcon)" opacity="0.8" />
  <circle cx="33" cy="26" r="1.2" fill="url(#goldGradIcon)" opacity="0.7" />
</svg>
