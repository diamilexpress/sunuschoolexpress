<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <linearGradient id="turqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 10)">
    <!-- Shield / Aura background -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#0E243F" stroke="url(#turqGrad)" stroke-width="2" />
    
    <!-- Open Book Base -->
    <path d="M16 54 C26 48 38 48 40 54 C42 48 54 48 64 54 L64 63 C54 57 42 57 40 63 C38 57 26 57 16 63 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M18 51 C27 46 38 46 40 51 C42 46 53 46 62 51 L62 53 C53 48 42 48 40 53 C38 48 27 48 18 53 Z" fill="#FFFFFF" opacity="0.8" />
    
    <!-- Central Spine -->
    <line x1="40" y1="52" x2="40" y2="63" stroke="#0E243F" stroke-width="1.5" />

    <!-- Lamp of Knowledge (Traditional Oil Lamp / Al-Misbah) -->
    <!-- Lamp Base & Bowl -->
    <path d="M30 46 C30 43 33 42 40 42 C47 42 50 43 50 46 C48 48 32 48 30 46 Z" fill="url(#goldGrad)" />
    <path d="M28 44 C24 43 23 39 27 38 C31 37 36 41 36 43" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Spout pointing right -->
    <path d="M46 43 C52 42 56 39 58 36 C55 36 49 40 46 42 Z" fill="url(#goldGrad)" />
    
    <!-- Flame (Glowing Turquoise & Gold) -->
    <path d="M58 35 C59 31 58 27 55 23 C53 27 50 28 51 32 C52 35 56 36 58 35 Z" fill="url(#turqGrad)" filter="url(#glow)" />
    <circle cx="55" cy="27" r="2.5" fill="#FFE082" />

    <!-- Knowledge Rays / Sparks -->
    <circle cx="40" cy="22" r="1.5" fill="url(#turqGrad)" opacity="0.8" />
    <circle cx="33" cy="26" r="1.2" fill="url(#goldGrad)" opacity="0.7" />
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(102, 38)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="800" font-size="28" fill="#F8F9FA" letter-spacing="-0.5">
      Sunu<tspan fill="url(#turqGrad)">School</tspan><tspan dx="10" dy="-2" font-size="16" font-weight="800" fill="url(#goldGrad)" letter-spacing="1.5">EXPRESS</tspan>
    </text>
    <!-- Tagline -->
    <text x="2" y="24" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="500" font-size="12" fill="#94A3B8" letter-spacing="0.5">
      Plateforme SaaS Écoles &amp; Daaras Modernes 🇸🇳
    </text>
  </g>
</svg>
